openapi: 3.0.0

info:
  title: Student API
  version: 1.0.0
  description: |
    A simple Student Management API built for learning backend fundamentals.
    Supports CRUD operations and responds with JSON.

servers:
  - url: /

paths:
  /api/students:
    get:
      summary: Get all students
      description: Returns a list of all students in the database.
      responses:
        '200':
          description: A list of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

    post:
      summary: Create a student
      description: Add a new student to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
            example:
              name: "Arya Stark"
              email: "arya@winterfell.com"
              course: "Sword Training"
              year: 2025
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'

  /api/students/{id}:
    get:
      summary: Get single student
      description: Retrieve a student by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the student
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Student not found

    put:
      summary: Update student
      description: Modify an existing student's details.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
            example:
              name: "Arya Stark"
              email: "arya.new@winterfell.com"
              course: "Face Changing 101"
              year: 2026
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Student not found

    delete:
      summary: Delete student
      description: Remove a student from the system.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              example:
                deleted: true
        '404':
          description: Student not found

components:
  schemas:
    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        course:
          type: string
        year:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        name: "Jon Snow"
        email: "jonsnow@nightswatch.com"
        course: "Swordsmanship"
        year: 2025
        created_at: "2025-01-01T10:00:00Z"
        updated_at: "2025-01-02T15:30:00Z"

    StudentInput:
      type: object
      required:
        - name
        - email
        - course
        - year
      properties:
        name:
          type: string
        email:
          type: string
        course:
          type: string
        year:
          type: integer