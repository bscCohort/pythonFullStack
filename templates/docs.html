<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spotlight API Docs</title>

  <!-- Stoplight CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f8f9fb;
  }

  elements-api {
    display: block;
    height: 100vh;
    margin: 0;
    padding: 0;
  }
</style>
</head>
<body>

  <!-- Stoplight API Viewer -->
  <elements-api
    apiDescriptionUrl="/openapi.yaml"
    router="hash"
    layout="sidebar"
  ></elements-api>

  <!-- Correct Stoplight Script -->
  <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>

</body>
</html>
