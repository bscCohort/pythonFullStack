site_name: Full Stack, End to End
site_url: https://bsccohort.github.io/pythonFullStack/
site_description: A two-month industrial training course built around one real project.
site_author: Asutosh Panda

# Every page students read lives in docs/notes/.
# Run the site from this folder:  cd docs && mkdocs serve
docs_dir: notes

theme:
  name: material

  # Light and dark, because a projector and a laptop want different things.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs           # top level sections become tabs
    - navigation.sections       # group pages in the sidebar
    - navigation.top            # back-to-top button
    - navigation.footer         # previous / next links, good for a linear path
    - navigation.indexes        # a section can have its own landing page
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy         # copy button on every code block
    - content.code.annotate     # numbered markers inside code blocks
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  # Callout boxes: !!! note, !!! warning, !!! tip
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

  # Code blocks: syntax highlighting, line numbers, and the numbered
  # annotations that expand when you click them. Very useful in class.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # This is what makes ```mermaid blocks render as diagrams.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Our own CSS, which is how the animated diagrams work.
extra_css:
  - stylesheets/extra.css

